[package]
name = "gpuix-native"
version = "0.7.0"
edition = "2021"
description = "GPUI bindings for Node.js via napi-rs"
license = "Apache-2.0"
license-file = "LICENSE"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
image = { version = "0.25", default-features = false }
# CSS value reading, including `calc()`. Kept in its own crate so its tests run
# without a GPU. See `css/`.
gpuix-css = { path = "css" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
anyhow = "1"
base64 = "0.22"
csscolorparser = "0.8.3"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
futures = "0.3"
# The retained tree is keyed by u64 ids that JS allocates as a counter, and it
# is probed on every `mark_changed` ancestor hop and once per child per frame in
# `build_virtual_list`. SipHash earns nothing on those keys.
rustc-hash = "2"

# Use the GPUI fork checked out in the zed submodule.
# Wasm cannot use the desktop gpui_platform features.
gpui = { path = "../../zed/crates/gpui", default-features = false, features = ["profiler"] }
thiserror = "2"
pulldown-cmark = { version = "0.12", default-features = false }
unicode-segmentation = "1"
web-time = "1"

# Syntect compiles a grammar's TextMate regexes lazily, on the FIRST highlight
# of that language, on the frame thread, inside a paint. fancy-regex takes
# ~133ms for TypeScript and ~17ms for Rust. Oniguruma takes ~12ms and ~1.6ms.
#
# Oniguruma cannot build for wasm32-unknown-unknown: onig_sys compiles C, and
# that target ships no libc, so clang fails on `#include <stdlib.h>`. Do not try
# again. Syntect also rejects both engines at once, so the two sections below
# must stay exactly complementary.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
syntect = { version = "5.3", default-features = false, features = ["regex-onig"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-onig"] }
gpui = { path = "../../zed/crates/gpui", default-features = false, features = ["font-kit", "profiler"] }
gpui_platform = { path = "../../zed/crates/gpui_platform", default-features = false, features = ["font-kit", "wayland", "x11"] }

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
napi = { version = "3", features = ["napi8", "serde-json"] }
napi-derive = "3"

# The slow half of the engine split above. fancy-regex is pure Rust, so it is
# the only Syntect engine that builds here, and the browser still pays ~133ms on
# its first TypeScript fence.
[target.'cfg(target_family = "wasm")'.dependencies]
syntect = { version = "5.3", default-features = false, features = ["regex-fancy"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
gpui_platform = { path = "../../zed/crates/gpui_platform", default-features = false }
js-sys = "0.3"
wasm-bindgen = "=0.2.127"
web-sys = { version = "0.3", features = ["Navigator", "Window"] }

# macOS text/graphics deps - pinned to avoid core-graphics version conflicts
# core-text 21.1.0 uses core-graphics 0.25 which conflicts with font-kit's core-graphics 0.24
[target.'cfg(target_os = "macos")'.dependencies]
core-text = "=21.0.0"
core-graphics = "=0.24.0"
# Production uses the embedded AppKit loop; tests use the native Metal renderer.
gpui_macos = { path = "../../zed/crates/gpui_macos", default-features = false, features = ["font-kit"] }

# Same crate GPUI uses. A .node cannot ship an exe manifest, so Windows DPI
# awareness is set at runtime in renderer.rs instead of via windows-manifest.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_HiDpi"] }

[features]
# test-support is default so published binaries include TestGpuixRenderer,
# letting users write GPU-backed tests for their apps.
default = ["test-support"]
test-support = ["gpui/test-support", "gpui_platform/test-support", "gpui_macos/test-support", "gpui_macos/font-kit"]

[build-dependencies]
napi-build = "2"

# Only the serialization bench needs a MessagePack codec. Keep it out of the
# shipped addon: the wire format is still JSON until the bench says otherwise.
[dev-dependencies]
rmp-serde = "1.3"

[[example]]
name = "hello"
path = "examples/hello.rs"

[[example]]
name = "bench_serde"
path = "examples/bench_serde.rs"

[profile.release]
lto = true
# Cargo strips debug info from release builds by default. Apple strip writes a
# LINKEDIT string pool at a 4-byte offset, and the dyld on macOS 26 rejects
# that with "mis-aligned LINKEDIT string pool", so the addon fails to load.
strip = "none"

# capture_screenshot encodes a png on every visual test. The encoder is
# too slow at opt-level 0 and vitest kills the worker, so build the
# image crates with opt-level 3 in debug builds too.
[profile.dev.package.png]
opt-level = 3

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

# The style parse benchmark. `harness = false` because it prints its own
# numbers rather than running as a test.
[[bench]]
name = "style_parse"
harness = false
